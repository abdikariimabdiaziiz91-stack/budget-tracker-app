<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <main>
        <section id="add-expense-section" class="card">
            <h2>Add Expense</h2>
            <div class="form-group">
                <label for="expense-name">Expense Name:</label>
                <input type="text" id="expense-name" placeholder="e.g., Grocery, Rent">
            </div>
            
            <div class="form-group">
                <label for="expense-amount">Amount ($):</label>
                <input type="number" id="expense-amount" placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="expense-category">Category:</label>
                <input type="text" id="expense-category" placeholder="e.g., Food, Transport">
            </div>

            <button type="button">Add Expense</button>
        </section>

        <section id="expenses-list-section" class="card">
            <h2>Your Expenses</h2>
            <p class="placeholder-text">No expenses yet</p>
        </section>
    </main>
</body>
</html>
